<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0b0e14;
            color: #f3f4f6;
            font-family: sans-serif;
            margin: 0;
            padding: 16px;
            padding-bottom: 80px;
        }

        .header {
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid #1f2937;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 20px;
            margin: 0;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            background: #11141b;
            padding: 4px;
            border-radius: 10px;
            border: 1px solid #1f2937;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 4px;
            background: transparent;
            border: none;
            color: #9ca3af;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active {
            background: #6366f1;
            color: #ffffff;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            background: #151921;
            border: 1px solid #1f2937;
            border-radius: 8px;
            color: #f3f4f6;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
        }

        .section { display: none; }
        .section.active { display: block; }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: #151921;
            border: 1px solid #1f2937;
            border-radius: 8px;
            color: #f3f4f6;
            font-size: 14px;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #6366f1;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .game-card {
            background: #151921;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .game-img {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
            background: #1f2937;
            flex-shrink: 0;
        }

        .game-details { flex: 1; }
        .game-category {
            font-size: 10px;
            color: #6366f1;
            font-weight: bold;
        }

        .game-title {
            font-size: 15px;
            font-weight: bold;
            color: #f3f4f6;
            margin: 2px 0;
        }

        .game-price {
            font-size: 12px;
            color: #10b981;
            font-weight: bold;
        }

        .actions { display: flex; flex-direction: column; gap: 6px; }

        .btn-download {
            padding: 10px 16px;
            background: #6366f1;
            color: #ffffff;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 99999;
        }

        .modal-card {
            background: #151921;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
        }

        .payment-number {
            background: #0b0e14;
            padding: 12px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #10b981;
            margin: 10px 0 15px 0;
            border: 1px dashed #6366f1;
        }

        .btn-paid {
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .btn-close {
            width: 100%;
            padding: 10px;
            background: transparent;
            color: #9ca3af;
            border: none;
            cursor: pointer;
        }

        .chat-container {
            display: flex; flex-direction: column; height: 380px;
            background: #151921; border: 1px solid #1f2937;
            border-radius: 10px; overflow: hidden;
        }
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .message-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 85%;
        }
        .message-wrapper.user-side { align-self: flex-end; }
        .message-wrapper.bot-side { align-self: flex-start; }

        .message { padding: 10px 14px; border-radius: 8px; font-size: 13px; }
        .message.bot { background: #1f2937; color: #f3f4f6; }
        .message.user { background: #6366f1; color: #ffffff; }

        .chat-input-area { display: flex; border-top: 1px solid #1f2937; padding: 8px; background: #11141b; }
        .chat-input { flex: 1; padding: 10px; background: #151921; border: 1px solid #1f2937; border-radius: 6px; color: #f3f4f6; font-size: 13px; outline: none; }
        .chat-send { background: #6366f1; color: white; border: none; padding: 0 16px; margin-left: 6px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Game Hub Market</h1>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tab1" onclick="switchSection(1)">Маркет</button>
        <button class="tab-btn" id="tab2" onclick="switchSection(2)">Панель</button>
        <button class="tab-btn" id="tab3" onclick="switchSection(3)">Gemini ИИ</button>
    </div>

    <div id="sec1" class="section active">
        <input type="text" id="searchInput" class="search-box" placeholder="Ўйинларни қидириш..." oninput="render()">
        <div id="gamesContainer"></div>
    </div>

    <div id="sec2" class="section">
        <div class="form-group">
            <label>Номи:</label>
            <input type="text" id="gName" placeholder="Масалан: Free Fire">
        </div>
        <div class="form-group">
            <label>Категория:</label>
            <select id="gCategory">
                <option value="Экшен">Экшен</option>
                <option value="Гонки">Гонки</option>
                <option value="Приложение">Приложение</option>
            </select>
        </div>
        <div class="form-group">
            <label>Нархи ($):</label>
            <input type="number" id="gPrice" placeholder="0 (бепул)">
        </div>
        <div class="form-group">
            <label>Расм линки (URL):</label>
            <input type="text" id="gImg" placeholder="https://... (расм манзили)">
        </div>
        <div class="form-group">
            <label>Файл линки (Сайт ёки юклаш манзили):</label>
            <input type="text" id="gLink" placeholder="https://example.com/file.apk">
        </div>
        <button class="btn-submit" onclick="addGame()">Ўйинни қўшиш</button>
    </div>

    <div id="sec3" class="section">
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message-wrapper bot-side">
                    <div class="message bot">Ассалому алайкум! Мен Game Hub ёрдамчисиман.</div>
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" class="chat-input" placeholder="Хабар ёзиш..." onkeypress="if(event.key==='Enter') sendChat()">
                <button class="chat-send" onclick="sendChat()">Юбориш</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="paymentModal">
        <div class="modal-card">
            <h3>Пул тўлаш</h3>
            <p style="font-size: 13px; color: #9ca3af; margin-top: 5px;">Ушбу рақамга <strong id="payAmount" style="color:#10b981">$0</strong> ўтказинг:</p>
            <div class="payment-number">+996 998 08 72 00</div>
            <button class="btn-paid" onclick="confirmPayment()">Мен тўладим</button>
            <button class="btn-close" onclick="closeModal()">Бекор қилиш</button>
        </div>
    </div>

    <script>
        let activeLink = "#";

        const defaultGames = [
            { id: 1, name: "Demo Offer (Admitad)", category: "Приложение", price: 0, img: "https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/commons/1/14/No_Image_Available.jpg", link: "https://tatrck.com/h/0Hu30weU0Zn6?url=https://att.com&s=website" },
            { id: 2, name: "PUBG Mobile", category: "Экшен", price: 0, img: "https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/en/1/15/PUBG_Mobile_New_Era_Logo.jpg", link: "https://www.pubgmobile.com" },
            { id: 3, name: "Brawl Stars", category: "Экшен", price: 0, img: "https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/en/5/53/Brawl_Stars_logo.png", link: "https://supercell.com/en/games/brawlstars/" },
            { id: 4, name: "Subway Surfers", category: "Экшен", price: 0, img: "https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/en/5/5a/Subway_Surfers_Logo.png", link: "https://subwaysurfers.com" },
            { id: 5, name: "Minecraft", category: "Экшен", price: 7.49, img: "https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/en/5/51/Minecraft_cover.png", link: "https://www.minecraft.net" },
            { id: 6, name: "CarX Street", category: "Гонки", price: 0, img: "https://images.weserv.nl/?url=is1-ssl.mzstatic.com/image/thumb/Purple126/v4/35/65/50/35655078-4ea7-8b55-d8cf-8dcf37c62d05/AppIcon-1-0-1x_U007emarketing-0-7-0-85-220.png/512x512bb.jpg", link: "https://carx-online.com" },
            { id: 7, name: "Asphalt 9", category: "Гонки", price: 0, img: "https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/en/f/fe/Asphalt_9_Legends_cover.jpg", link: "https://www.gameloft.com" },
            { id: 8, name: "Telegram", category: "Приложение", price: 0, img: "https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg", link: "https://telegram.org" },
            { id: 9, name: "CapCut Pro", category: "Приложение", price: 2.99, img: "https://images.weserv.nl/?url=images.sftcdn.net/images/t_app-cover-l,f_auto/p/23e387da-a496-48ee-a619-a9a3f3b6169c/1653199852/capcut-logo", link: "https://www.capcut.com" }
        ];

        function loadGames() {
            const data = localStorage.getItem('gh_games_v16');
            return data ? JSON.parse(data) : defaultGames;
        }

        function saveGames(data) {
            localStorage.setItem('gh_games_v16', JSON.stringify(data));
            render();
        }

        function switchSection(secNum) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));

            document.getElementById('tab' + secNum).classList.add('active');
            document.getElementById('sec' + secNum).classList.add('active');
        }

        function render() {
            const games = loadGames();
            const search = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('gamesContainer');
            container.innerHTML = '';

            const filtered = games.filter(g => g.name.toLowerCase().includes(search));

            if(filtered.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:20px; color:#9ca3af;">Ҳеч нарса топилмади</p>';
                return;
            }

            filtered.forEach(g => {
                const item = document.createElement('div');
                item.className = 'game-card';
                item.innerHTML = `
                    <img src="${g.img ? 'https://images.weserv.nl/?url=' + g.img.replace('https://', '').replace('http://', '') : 'https://upload.wikimedia.org/wikipedia/commons/1/14/No_Image_Available.jpg'}" class="game-img" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/1/14/No_Image_Available.jpg'">
                    <div class="game-details">
                        <div class="game-category">${g.category}</div>
                        <div class="game-title">${g.name}</div>
                        <div class="game-price">${g.price === 0 ? 'Бепул' : '$' + g.price.toFixed(2)}</div>
                    </div>
                    <div class="actions">
                        <button class="btn-download" onclick="handleDownload('${g.link}', ${g.price})">Скачать</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function handleDownload(link, price) {
            activeLink = link;
            if(price === 0) {
                window.location.href = link;
            } else {
                document.getElementById('payAmount').innerText = '$' + price.toFixed(2);
                document.getElementById('paymentModal').style.display = 'flex';
            }
        }

        function addGame() {
            const name = document.getElementById('gName').value.trim();
            if(!name) { alert('Номини киритинг!'); return; }
            
            const list = loadGames();
            list.unshift({
                id: Date.now(),
                name: name,
                category: document.getElementById('gCategory').value,
                price: parseFloat(document.getElementById('gPrice').value) || 0,
                img: document.getElementById('gImg').value.trim(),
                link: document.getElementById('gLink').value.trim() || 'https://example.com'
            });
            saveGames(list);
            
            document.getElementById('gName').value = '';
            document.getElementById('gPrice').value = '';
            document.getElementById('gImg').value = '';
            document.getElementById('gLink').value = '';
            
            switchSection(1);
        }

        function confirmPayment() {
            alert('Тўлов учун раҳмат!');
            closeModal();
            window.location.href = activeLink;
        }

        function closeModal() {
            document.getElementById('paymentModal').style.display = 'none';
        }

        function sendChat() {
            const input = document.getElementById('chatInput');
            const txt = input.value.trim();
            if(!txt) return;

            const box = document.getElementById('chatMessages');
            box.innerHTML += `<div class="message-wrapper user-side"><div class="message user">${txt}</div></div>`;
            input.value = '';
            box.scrollTop = box.scrollHeight;

            setTimeout(function() {
                let ans = "Маркет муваффақиятли ишламоқда!";
                const l = txt.toLowerCase();
                if(l.includes('салом') || l.includes('привет')) {
                    ans = "Ассалому алайкум! Қандай ёрдам бера оламан?";
                }

                box.innerHTML += `<div class="message-wrapper bot-side"><div class="message bot">${ans}</div></div>`;
                box.scrollTop = box.scrollHeight;
            }, 400);
        }

        render();

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
                    </html>
